[build-system]
requires = ["scikit-build-core>=0.5", "nanobind>=1.8"]
build-backend = "scikit_build_core.build"

[project]
name = "cbls"
version = "0.1.0"
description = "Constraint-Based Local Search engine (C++ core with Python bindings)"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    # Without these, the documented `pip install -e '.[dev]'` bootstrap yields
    # a pre-push whose Python gate cannot run at all. (That gate now reports a
    # missing tool as a finding rather than skipping in silence; the older
    # advisory ruff/mypy steps still guard on the binary existing and skip
    # quietly, which is why they are advisory.)
    #
    # Pinned exactly, for the same reason as the clang tools below and stated
    # once there: both are a HARD BLOCK at push over every tracked .py outside
    # benchmarks/ (issue #154), and both change their finding set and their
    # formatter style between releases. Unpinned, "the gated files are at zero"
    # silently means "at zero on whichever version this checkout resolved", and
    # a fresh clone six months from now goes red with no code change — whose
    # only documented escape is the `--no-verify` CLAUDE.md forbids. Bump them
    # deliberately, in their own commit, the way the clang pins are bumped.
    "ruff==0.16.1",
    "mypy==2.3.0",
    # clang-format and clang-tidy come from PyPI rather than the system, and
    # are pinned exactly: clang-format's output and clang-tidy's finding set
    # both change between major releases, so an unpinned or system copy would
    # reformat differently from everyone else's commit and report a different
    # set at push time. The hooks prefer .venv/bin over PATH for this reason.
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
    # Also in [build-system].requires, but pip resolves that in an isolated
    # build environment and never installs it into the venv. The gated build
    # (CLAUDE.md's ```build fence) locates nanobind by running
    # `python -m nanobind --cmake_dir` against .venv/bin/python, so without it
    # here the documented bootstrap yields a venv that cannot build the
    # bindings -- and the 81 binding tests would go unrun.
    "nanobind>=1.8",
]
benchmarks = [
    # CP-SAT's violation_ls worker, the MIPfeas baseline. 9.7 is when the
    # num_violation_ls parameter shipped. The upper bound is not caution about
    # bugs: benchmarks/mipfeas/cpsat_solve.py reads the worker restriction and the
    # whole incumbent trace out of a debug log that carries no stability
    # guarantee, and every parameter fact in it was established against 9.15. A
    # release that renames a subsolver flag or reformats a log line produces a
    # degraded or empty baseline across the roster without crashing, so the range
    # is pinned to what was checked and `cpsat_solve.py --preflight` re-checks it
    # at run time. Raise the bound by running the preflight, not by editing it.
    "ortools>=9.7,<9.16",
    # SCIP's nonconvex spatial branch-and-bound, the MINLPLib baseline. The 6.x
    # wheels bundle SCIP 9/10, whose AMPL .nl reader lets the baseline consume
    # the exact same instance files the CBLS runner reads, with no re-modelling.
    # The committed results came from 6.2.1 / SCIP 10.0; every result row records
    # the pair it was produced by.
    "pyscipopt>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C901", # mccabe complexity
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# pep8-naming, waived for ONE file and TWO rules. `benchmarks/chped/reference_solve.py`
# is a reference solver implementing a published unit-commitment formulation, and
# `P` (dispatch vector), `A` (constraint matrix) and `T` (periods) are that
# formulation's own symbols. Renaming them to lower_case makes the code harder to
# check line-by-line against the paper it exists to reproduce -- and this solver's
# numbers are published in benchmarks/instances/uc-chped/comparison.csv, so being
# able to audit it against the source is the point. Same argument, and the same
# shape, as src/io/.clang-tidy waiving the naming check for the vendored readers.
# Scoped per file and per rule: nothing else in the tree may drift.
[tool.ruff.lint.per-file-ignores]
"benchmarks/chped/reference_solve.py" = ["N803", "N806"]
# `base_T` is the same formulation's symbol for the horizon length, in the
# function that extends an instance to more periods.
"benchmarks/instances/uc-chped/data.py" = ["N806"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# `data` is imported by bare module name because reference_solve.py is run from
# inside its own directory (`cd benchmarks/chped && python reference_solve.py`),
# and `scipy`/`pyscipopt` ship no type stubs. Scoped per module rather than set
# globally, on the same argument as the _cbls_core override below: a blanket
# ignore_missing_imports would hide a genuinely mistyped import anywhere.
[[tool.mypy.overrides]]
module = ["data", "scipy.*", "pyscipopt"]
ignore_missing_imports = true

# _cbls_core is a compiled nanobind extension with no stubs, so mypy cannot
# resolve it and reported import-not-found on every run -- including when the
# module was built and importable. Scoped to this one module rather than set
# globally: `ignore_missing_imports = true` at top level would also swallow a
# genuine typo in a real dependency, which is the failure this repo's "don't
# ignore type errors" rule is aimed at.
[[tool.mypy.overrides]]
module = "_cbls_core"
ignore_missing_imports = true
