[build-system]
requires = ["scikit-build-core>=0.5", "nanobind>=1.8"]
build-backend = "scikit_build_core.build"

[project]
name = "cbls"
version = "0.1.0"
description = "Constraint-Based Local Search engine (C++ core with Python bindings)"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    # The pre-commit and pre-push hooks guard every ruff/mypy step on the
    # binary existing in the venv, and skip in silence when it doesn't. Without
    # these, the documented `pip install -e '.[dev]'` bootstrap yields a
    # pre-push that lints and type-checks nothing while printing "All checks
    # passed."
    "ruff>=0.5",
    "mypy>=1.10",
    # clang-format and clang-tidy come from PyPI rather than the system, and
    # are pinned exactly: clang-format's output and clang-tidy's finding set
    # both change between major releases, so an unpinned or system copy would
    # reformat differently from everyone else's commit and report a different
    # set at push time. The hooks prefer .venv/bin over PATH for this reason.
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
    # Also in [build-system].requires, but pip resolves that in an isolated
    # build environment and never installs it into the venv. The gated build
    # (CLAUDE.md's ```build fence) locates nanobind by running
    # `python -m nanobind --cmake_dir` against .venv/bin/python, so without it
    # here the documented bootstrap yields a venv that cannot build the
    # bindings -- and the 81 binding tests would go unrun.
    "nanobind>=1.8",
]
benchmarks = [
    # CP-SAT's violation_ls worker, the MIPfeas baseline. 9.7 is when the
    # num_violation_ls parameter shipped.
    "ortools>=9.7",
    # SCIP's nonconvex spatial branch-and-bound, the MINLPLib baseline. The 6.x
    # wheels bundle SCIP 9/10, whose AMPL .nl reader lets the baseline consume
    # the exact same instance files the CBLS runner reads, with no re-modelling.
    # The committed results came from 6.2.1 / SCIP 10.0; every result row records
    # the pair it was produced by.
    "pyscipopt>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C901", # mccabe complexity
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# _cbls_core is a compiled nanobind extension with no stubs, so mypy cannot
# resolve it and reported import-not-found on every run -- including when the
# module was built and importable. Scoped to this one module rather than set
# globally: `ignore_missing_imports = true` at top level would also swallow a
# genuine typo in a real dependency, which is the failure this repo's "don't
# ignore type errors" rule is aimed at.
[[tool.mypy.overrides]]
module = "_cbls_core"
ignore_missing_imports = true
