# xk tune study: MINLPLib (#265, plan on #261). Run on the workstation's local
# queue only: XK_SERVER=local XK_PROJECT=cbls-tune (see README.md here).
#
# Sets: heldout/ only, never the published roster. Within each structure, in
# sha256("cbls-minlplib-tune:261:<name>") order, the 50 split
# screen/intermediate/confirm as mixed-integer 8/7/6, other 8/6/6 and
# transcendental 4/2/3 (confirm takes the third transcendental row: those
# terms are the class's comparative point). The screen runs at 5 s, the
# intermediate and confirm sets at 20 s; confirm at 2 seeds.

[study]
name = "cbls-minlplib"
version = 1
repo = "https://github.com/spoorendonk/cbls.git"
rev = "main"
cores = "0-15"
threads = 16
exclusive = true
trials = 24
sampler = "tpe"
sampler_seed = 0
p_threshold = 0.1
correction = "pocock"
prune_against = "reference"

[build]
command = "cmake -S {src} -B {build} -DCBLS_BUILD_TESTS=OFF -DCBLS_BUILD_EXAMPLES=OFF -DCBLS_INSTALL_GIT_HOOKS=OFF && cmake --build {build} -j4 --target cbls_minlplib"

[run]
command = "python3 {src}/benchmarks/common/tune_trial.py minlplib --build-dir {build} --out-dir {rundir} --instance {instance} --seed {seed} --threads {threads} --budget {secs} --inst-dir {src}/benchmarks/instances/minlplib/heldout -- {config}"
timeout = 300

# The reference is the runner's defaults, compound moves on (#256's dev: off
# is worse on all 3 seeds), so compound is not a param here.
[space]
novelty_prob = { float = [0.1, 0.9], default = 0.5, format = "--novelty-prob {value}" }
unproductive_iters = { int = [50, 3000], log = true, default = 300, format = "--unproductive-iters {value}" }
perturbation_period = { int = [10, 1000], log = true, default = 100, format = "--perturbation-period {value}" }
lns = { bool = true, render = false, default = true }
lns_interval = { int = [1, 20], log = true, when = "lns", default = 3, format = "--lns-interval {value}" }
no_lns = { choice = ["--no-lns"], when = { lns = false }, default = "--no-lns", format = "{value}" }
float_hook = { bool = true, render = false, default = true }
no_float_hook = { choice = ["--no-float-hook"], when = { float_hook = false }, default = "--no-float-hook", format = "{value}" }
tie_break = { bool = true, render = false, default = true }
no_tie_break = { choice = ["--no-objective-tie-break"], when = { tie_break = false }, default = "--no-objective-tie-break", format = "{value}" }
near_value = { bool = true, render = false, default = false }
perturb_near_value = { choice = ["--perturb-near-value"], when = "near_value", default = "--perturb-near-value", format = "{value}" }

[cost]
json = "cost"
file = "{rundir}/cost.json"
failed = 3.0  # worse than a run that never finds a solution

[elites]
top = 3
keep = 2
alpha = 0.05

[confirm]
rule = "wilcoxon"
alpha = 0.05

# As in mipfeas.study.toml, the intermediate set is not the screen's
# instances: rho tests 5 s on the screen's 20 against 20 s on the
# intermediate 15, budget and instances at once. Without a [budget], xk tune
# fidelity refuses the screen set at the same secs.
[fidelity]
set = "intermediate"
factor = "none"
min_rho = 0.7
configs = 4

