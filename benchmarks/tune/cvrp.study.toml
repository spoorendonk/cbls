# xk tune study: CVRPLIB X (#263, plan on #261). Run on the workstation's
# local queue only: XK_SERVER=local XK_PROJECT=cbls-tune.
#
#   xk submit tune benchmarks/tune/cvrp.study.toml --trials 24
#   xk submit tune benchmarks/tune/cvrp.study.toml --stage elites
#   xk submit tune benchmarks/tune/cvrp.study.toml --stage confirm
#   xk submit tune benchmarks/tune/cvrp.study.toml --stage fidelity
#   xk tune importance benchmarks/tune/cvrp.study.toml
#
# Sets: dev.csv only, never report.csv. Within each of Hexaly's size bands, in
# download.py's own order (sha256("cbls-cvrp-dev:196:<name>")), the first two
# are tuning instances, and so is the third of the two largest bands; the rest
# (8) are held out for confirm. The screen runs the 12 at 10 s, the
# intermediate set the same 12 at 30 s (which is what `fidelity` compares), and
# confirm the 8 at 30 s.

[study]
name = "cbls-cvrp"
version = 1
repo = "https://github.com/spoorendonk/cbls.git"
rev = "main"
cores = "0-15"
threads = 16
exclusive = true
trials = 24
sampler = "tpe"
sampler_seed = 0
p_threshold = 0.1
correction = "pocock"
prune_against = "reference"

# The reference is #204's default arm: --neighbours 20 with selection auto,
# which resolves to granular_best under a neighbour list.
[[study.enqueue]]
params = { selection = "violation_guided" }  # #204's guided arm

[build]
command = "cmake -S {src} -B {build} -DCBLS_BUILD_TESTS=OFF -DCBLS_BUILD_EXAMPLES=OFF -DCBLS_INSTALL_GIT_HOOKS=OFF && cmake --build {build} -j4 --target cbls_cvrp cbls_mipfeas cbls_minlplib cbls_uc_chped"

[run]
command = "python3 {src}/benchmarks/common/tune_trial.py cvrp --build-dir {build} --out-dir {rundir} --instance {instance} --seed {seed} --threads {threads} --budget {secs} -- {config}"
timeout = 300

[space]
neighbours = { int = [5, 50], log = true, default = 20, format = "--neighbours {value}" }
selection = { choice = ["granular_best", "violation_guided", "best_of_sample", "first_improving"], default = "granular_best", format = "--structural-selection {value}" }
# The sample size is read under every policy but first_improving, which the
# runner refuses it with; one param per policy that reads it.
sample_gb = { int = [1, 64], log = true, when = { selection = "granular_best" }, default = 8, format = "--structural-sample-size {value}" }
sample_vg = { int = [1, 64], log = true, when = { selection = "violation_guided" }, default = 8, format = "--structural-sample-size {value}" }
sample_bos = { int = [1, 64], log = true, when = { selection = "best_of_sample" }, default = 8, format = "--structural-sample-size {value}" }
perturbation_period = { int = [10, 1000], log = true, default = 100, format = "--perturbation-period {value}" }
lns = { bool = true, render = false, default = true }
lns_interval = { int = [1, 20], log = true, when = "lns", default = 3, format = "--lns-interval {value}" }
no_lns = { choice = ["--no-lns"], when = { lns = false }, default = "--no-lns", format = "{value}" }

[cost]
json = "cost"
file = "{rundir}/cost.json"
failed = 1000.0  # gap percent: worse than any feasible run

[elites]
top = 3
keep = 2
alpha = 0.05

[confirm]
rule = "wilcoxon"
alpha = 0.05

[fidelity]
set = "intermediate"
factor = "none"
min_rho = 0.7
configs = 4

